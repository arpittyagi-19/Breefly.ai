<!DOCTYPE html>
<html>
<head>
    <title>Ask Questions</title>
</head>
<body>
    <h2>Ask a question about your uploaded content</h2>

    <form method="POST" action="/ask">
        <input type="text" name="question" placeholder="Enter your question" required>
        <button type="submit">Ask</button>
    </form>

    {% if question %}
        <h3>Question:</h3>
        <p>{{ question }}</p>
        <h3>Answer:</h3>
        <p>{{ answer }}</p>
    {% endif %}
</body>
</html>
