<!DOCTYPE html>
<html>
<head>
    <title>RAG Upload</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<h2>Upload YouTube, PDF, or TXT</h2>

<form method="POST" enctype="multipart/form-data">
    <label><input type="radio" name="source_type" value="youtube" checked> YouTube</label>
    <input type="text" name="youtube_url" placeholder="YouTube URL">

    <label><input type="radio" name="source_type" value="pdf"> PDF File</label>
    <input type="file" name="pdf_file" accept=".pdf">

    <label><input type="radio" name="source_type" value="txt"> Text File</label>
    <input type="file" name="txt_file" accept=".txt">

    <button type="submit">Submit</button>
</form>

{% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
</body>
</html>
